name: Check stores

# Vercel's free plan only runs a cron job once a day, so GitHub calls the backend every 15 minutes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-stores
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the backend to read every store
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::Add the CRON_SECRET repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" https://recon.isx.re/cron/check
