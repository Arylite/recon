name: Check stores

# The phones ask for a check every 15 minutes; this hourly run covers web-only users and is cheap:
# a store already read today comes from the cache, so Riot is only called once a day per account.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-stores
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the backend to read every store
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::Add the CRON_SECRET repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" https://recon.isx.re/cron/check
