name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow reuses these jobs to build what it publishes.
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the Android build (1.2.3)
        type: string
        required: true

# A newer push makes the run of the previous one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.0.0' }}

jobs:
  ascii:
    name: ASCII only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # gradlew is generated by Gradle and the lockfile by npm; both are kept as shipped.
      - name: Reject non-ASCII characters
        run: |
          if git grep -nIP '[^\x00-\x7F]' -- . ':!android/gradlew' ':!backend/package-lock.json'; then
            echo "::error::Non-ASCII characters found (see above)"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: valorant-store-alert:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and wait for its health check
        run: |
          docker run -d --name backend -p 8080:8080 -e API_TOKEN=ci -e SECRET=ci valorant-store-alert:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          docker logs backend
          exit 1
      - name: Check the auth wall
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/wishlist)" = 401

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Restores the Gradle user home (wrapper, dependencies, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VALOALERT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Lint and build
        env:
          VERSION_NAME: ${{ env.VERSION }}
          VERSION_CODE: ${{ github.run_number }}
          VALOALERT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VALOALERT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VALOALERT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck lintRelease assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk ../ValoStoreAlert-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ValoStoreAlert-android.apk
          retention-days: 7
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/
          retention-days: 7

  # The single check to require in branch protection, whatever jobs are added above.
  passed:
    name: CI passed
    if: always()
    needs: [ascii, backend, docker, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
