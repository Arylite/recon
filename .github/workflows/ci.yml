name: CI

on:
  pull_request:
  workflow_dispatch:
  # The release workflow reuses these jobs to build what it publishes.
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the Android build (1.2.3)
        type: string
        required: true

# A newer push makes the run of the previous one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.0.0' }}

jobs:
  ascii:
    name: ASCII only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # gradlew is generated by Gradle and the lockfile by npm; both are kept as shipped.
      - name: Reject non-ASCII characters
        run: |
          if git grep -nIP '[^\x00-\x7F]' -- . ':!android/gradlew' ':!backend/package-lock.json'; then
            echo "::error::Non-ASCII characters found (see above)"
            exit 1
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Next.js builds without Redis or real secrets; they are only read when a request comes in.
      - run: npm run build
        env:
          API_TOKEN: ci
          SECRET: ci

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Restores the Gradle user home (wrapper, dependencies, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VALOALERT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Lint and build
        env:
          VERSION_NAME: ${{ env.VERSION }}
          # The app key, not a secret worth much: it is readable in the APK.
          ORG_GRADLE_PROJECT_apiToken: ${{ secrets.API_TOKEN }}
          VERSION_CODE: ${{ github.run_number }}
          VALOALERT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VALOALERT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VALOALERT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck lintRelease assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk ../Recon-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Recon-android.apk
          retention-days: 7
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/
          retention-days: 7

  # The single check to require in branch protection, whatever jobs are added above.
  passed:
    name: CI passed
    if: always()
    needs: [ascii, backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
