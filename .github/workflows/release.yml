name: Release

# Every push to main that passes CI publishes a signed APK as a new release. The backend and the
# website deploy on their own: Vercel builds every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases go out in push order; a newer push waits instead of cancelling one half published.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/Recon-android.apk --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Recon $VERSION" --generate-notes
